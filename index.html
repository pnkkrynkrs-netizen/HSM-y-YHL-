<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1830"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HSM & YHL CRM">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png">
<title>HSM & YHL CRM</title>
<style>
body{margin:0;background:#f4f6f9;color:#142033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:80px}
header{background:#0b1830;color:white;padding:calc(18px + env(safe-area-inset-top)) 16px 16px;position:sticky;top:0}
main{max-width:760px;margin:auto;padding:15px}.top{display:flex;justify-content:space-between}.logo{font-weight:800;font-size:20px}.logo small{display:block;color:#c9a45c;font-size:9px;letter-spacing:1.5px}.status{font-size:10px;border:1px solid #2a5270;border-radius:20px;padding:6px}
h1{font-size:25px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.box,.item{background:white;border:1px solid #e3e7ed;border-radius:14px;padding:14px;margin-bottom:10px}.label{font-size:10px;color:#718096}.metric{font-size:22px;font-weight:800}.btn{border:0;border-radius:11px;padding:12px 14px;background:#0b1830;color:white;font-weight:700}.gold{background:#c9a45c;color:#111}.light{background:#edf1f5;color:#263244}button{font:inherit}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8dee7;border-radius:11px;font:inherit;font-size:16px;margin-top:5px}.form{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.meta{font-size:12px;color:#718096;margin-top:5px}.list{display:grid;gap:9px}.itemhead{display:flex;justify-content:space-between;gap:8px}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e3e7ed;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:5}.nav{border:0;background:none;color:#667085;font-size:10px}.nav b{display:block;font-size:19px}.active{color:#0b1830;font-weight:800}.fab{position:fixed;right:18px;bottom:92px;width:54px;height:54px;border:0;border-radius:50%;background:#c9a45c;font-size:28px;z-index:6}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:10}.modal.open{display:flex}.sheet{background:white;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}.close{float:right;border:0;background:#eee;border-radius:50%;width:36px;height:36px;font-size:22px}.empty{text-align:center;color:#718096;padding:25px}.note{font-size:12px;background:#fff8e7;border:1px solid #efdfb2;border-radius:10px;padding:10px}
</style></head><body>
<header><div class="top"><div class="logo">HSM & YHL<small>TRAVEL CRM</small></div><div class="status" id="status">OFFLINE READY</div></div></header>
<main id="app"></main>
<nav class="bottom">
<button class="nav active" data-p="home">📊<b>Inicio</b></button><button class="nav" data-p="clients">👥<b>Clientes</b></button>
<button class="nav" data-p="services">✈️<b>Servicios</b></button><button class="nav" data-p="payments">💰<b>Pagos</b></button><button class="nav" data-p="more">☰<b>Más</b></button></nav>
<button class="fab" id="fab">+</button>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h3 id="mt"></h3><div id="mb"></div></div></div>
<script>
const STORES=["clients","services","payments","gestors","tasks"];let page="home";
const dbp=new Promise((ok,no)=>{let r=indexedDB.open("HSM_YHL_CRM",1);r.onupgradeneeded=()=>STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:"id"})});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const all=s=>dbp.then(db=>new Promise((ok,no)=>{let q=db.transaction(s,"readonly").objectStore(s).getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}));
const put=(s,x)=>dbp.then(db=>new Promise((ok,no)=>{let t=db.transaction(s,"readwrite");t.objectStore(s).put(x);t.oncomplete=ok;t.onerror=()=>no(t.error)}));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money=(n,c="USD")=>new Intl.NumberFormat("en-US",{style:"currency",currency:c,maximumFractionDigits:2}).format(+n||0);
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{page=b.dataset.p;render()});
fab.onclick=()=>page==="clients"?clientForm():page==="services"?serviceForm():page==="payments"?paymentForm():taskForm();
async function render(){document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.p===page));if(page==="home")home();else if(page==="clients")clients();else if(page==="services")services();else if(page==="payments")payments();else more()}
async function home(){let[c,s,p]=await Promise.all(STORES.slice(0,3).map(all));app.innerHTML=`<h1>HSM & YHL</h1><div class="meta">CRM móvil con base de datos offline.</div><div class="cards"><div class="card"><div class="label">CLIENTES</div><div class="metric">${c.length}</div></div><div class="card"><div class="label">SERVICIOS</div><div class="metric">${s.length}</div></div><div class="card"><div class="label">VENTAS</div><div class="metric">${money(s.reduce((a,x)=>a+(+x.total||0),0))}</div></div><div class="card"><div class="label">COBRADO</div><div class="metric">${money(p.reduce((a,x)=>a+(+x.amount||0),0))}</div></div></div><div class="box"><b>Acciones rápidas</b><p><button class="btn gold" onclick="clientForm()">+ Cliente</button> <button class="btn light" onclick="serviceForm()">+ Servicio</button> <button class="btn light" onclick="paymentForm()">+ Pago</button></p></div><div class="box note">Los datos se guardan con IndexedDB en este dispositivo. Usa “Más → Exportar” para respaldos.</div>`}
async function clients(){let c=await all("clients");app.innerHTML=`<h1>Clientes</h1><input id="q" placeholder="🔎 Buscar cliente"><div id="list">${clist(c)}</div>`;q.oninput=()=>list.innerHTML=clist(c.filter(x=>(x.name+" "+x.phone+" "+x.country).toLowerCase().includes(q.value.toLowerCase())))}
function clist(a){return a.length?`<div class="list">${a.slice().reverse().map(x=>`<div class="item itemhead"><div><b>${esc(x.name)}</b><div class="meta">${esc(x.phone||"Sin teléfono")} · ${esc(x.country||"")}</div></div><button class="btn light" onclick="clientForm('${x.id}')">Editar</button></div>`).join("")}</div>`:`<div class="empty">No hay clientes.</div>`}
async function clientForm(i=""){let x=(await all("clients")).find(a=>a.id===i)||{};openModal(i?"Editar cliente":"Nuevo cliente",`<form class="form" onsubmit="saveClient(event,'${i}')"><label>Nombre<input required name="name" value="${esc(x.name)}"></label><div class="row"><label>Teléfono<input name="phone" value="${esc(x.phone)}"></label><label>País<input name="country" value="${esc(x.country)}"></label></div><label>Email<input name="email" value="${esc(x.email)}"></label><label>Notas<textarea name="notes">${esc(x.notes)}</textarea></label><button class="btn gold">Guardar</button></form>`)}
async function saveClient(e,i){e.preventDefault();let f=new FormData(e.target);await put("clients",{id:i||uid(),name:f.get("name"),phone:f.get("phone"),country:f.get("country"),email:f.get("email"),notes:f.get("notes")});closeModal();render()}
async function services(){let s=await all("services"),c=await all("clients");let cn=id=>c.find(x=>x.id===id)?.name||"—";app.innerHTML=`<h1>Servicios</h1><div class="list">${s.slice().reverse().map(x=>`<div class="item"><b>${esc(cn(x.clientId))}</b><div class="meta">${esc(x.company)} · ${esc(x.type)} · ${esc(x.date)}</div><b>${money(x.total,x.currency)}</b></div>`).join("")||'<div class="empty">No hay servicios.</div>'}</div>`}
async function serviceForm(){let c=await all("clients");openModal("Nuevo servicio",`<form class="form" onsubmit="saveService(event)"><label>Empresa<select name="company"><option>HSM</option><option>YHL</option></select></label><label>Tipo<select name="type"><option>Boleto</option><option>Hotel</option><option>Paquete</option><option>Visa</option><option>Rent a car</option><option>Traslado</option><option>Otro</option></select></label><label>Cliente<select required name="clientId"><option value="">Seleccionar...</option>${c.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></label><div class="row"><label>Fecha<input type="date" name="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Pasajeros<input type="number" name="passengers" value="1"></label></div><div class="row"><label>Total<input required type="number" step=".01" name="total"></label><label>Moneda<select name="currency"><option>USD</option><option>EUR</option><option>CUP</option></select></label></div><button class="btn gold">Guardar</button></form>`)}
async function saveService(e){e.preventDefault();let f=new FormData(e.target);await put("services",{id:uid(),company:f.get("company"),type:f.get("type"),clientId:f.get("clientId"),date:f.get("date"),passengers:+f.get("passengers")||1,total:+f.get("total")||0,currency:f.get("currency")});closeModal();render()}
async function payments(){let p=await all("payments");app.innerHTML=`<h1>Pagos</h1><div class="list">${p.slice().reverse().map(x=>`<div class="item"><b>${money(x.amount,x.currency)}</b><div class="meta">${esc(x.date)} · ${esc(x.method)}</div></div>`).join("")||'<div class="empty">No hay pagos.</div>'}</div>`}
async function paymentForm(){let s=await all("services");openModal("Registrar pago",`<form class="form" onsubmit="savePayment(event)"><label>Servicio<select required name="serviceId"><option value="">Seleccionar...</option>${s.map(x=>`<option value="${x.id}">${esc(x.type)} · ${money(x.total,x.currency)}</option>`).join("")}</select></label><label>Importe<input required type="number" step=".01" name="amount"></label><label>Moneda<select name="currency"><option>USD</option><option>EUR</option><option>CUP</option></select></label><label>Método<select name="method"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Otro</option></select></label><button class="btn gold">Guardar</button></form>`)}
async function savePayment(e){e.preventDefault();let f=new FormData(e.target);await put("payments",{id:uid(),serviceId:f.get("serviceId"),amount:+f.get("amount")||0,currency:f.get("currency"),method:f.get("method"),date:new Date().toISOString().slice(0,10)});closeModal();render()}
async function more(){app.innerHTML=`<h1>Más</h1><div class="box"><b>Respaldo</b><p class="note">Exporta tus datos y guárdalos en Archivos/iCloud.</p><button class="btn gold" onclick="backup()">⬇ Exportar JSON</button></div><div class="box"><b>Próximas fases</b><div class="meta">Gestores, comisiones, agenda avanzada, documentos, autenticación y sincronización opcional.</div></div>`}
async function backup(){let o={version:1,exportedAt:new Date().toISOString(),stores:{}};for(let s of STORES)o.stores[s]=await all(s);let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:"application/json"}));a.download="HSM-YHL-CRM-backup.json";a.click()}
function openModal(t,b){mt.textContent=t;mb.innerHTML=b;modal.classList.add("open")}function closeModal(){modal.classList.remove("open")}
if("serviceWorker"in navigator)navigator.serviceWorker.register("./service-worker.js").then(()=>status.textContent="PWA READY").catch(()=>{});
render();
</script></body></html>
